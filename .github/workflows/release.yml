name: Build and Release

# Manual FALLBACK. The primary release path is attended, on the developer's machine: scripts\release.ps1 -Tag vX.Y.Z
# (build, verify.ps1 gate, package, tag, upload). This workflow exists for the day that machine is unavailable; it packages
# with the same scripts\package.ps1 so the zip layout cannot drift. No tag trigger: a local release and a CI release must
# never race for the same tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.1); must already be pushed"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      # Puts cl/link/nmake for x86 on PATH (equivalent of vcvars32.bat)
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Build Zero Hour (Release, Win32)
        shell: cmd
        run: cmake --workflow --preset win32

      - name: Package (same script as local releases)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}   # fetch-addons.ps1 downloads add-on release assets with gh
        run: |
          & scripts/package.ps1 -Tag "${{ inputs.tag }}" -Sha "${{ github.sha }}" -OutDir out
          exit $LASTEXITCODE

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            out/zh-game-${{ inputs.tag }}.zip
            out/zh-launcher-${{ inputs.tag }}.zip
            out/zh-symbols-${{ inputs.tag }}.pdb
          generate_release_notes: true
